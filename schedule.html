<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="When CoopGG streams, in your own time zone, with a countdown to the next stream.">
<title>CoopGG | Stream Schedule</title>
<link rel="icon" type="image/png" href="assets/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Tektur:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  /* ---------- next stream ---------- */
  .next {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.4rem 1.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.1rem 1.5rem;
  }
  .next.is-live { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--panel); }
  .next-label { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .next.is-live .next-label { color: var(--accent-text); }
  .next-time { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 4vw, 1.75rem); letter-spacing: 0.02em; margin-top: 0.25rem; text-wrap: balance; }
  .next-count { color: var(--text-dim); margin-top: 0.15rem; font-variant-numeric: tabular-nums; }

  /* ---------- week ---------- */
  .week-title { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 2.2rem 0 0.2rem; }
  .tz-note { color: var(--text-dim); font-size: 0.9rem; }
  .tz-note b { color: var(--text); font-weight: 600; }
  .week { list-style: none; display: grid; gap: 0.5rem; margin-top: 1rem; }
  .day {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 0.95rem 1.2rem;
  }
  .day-main { display: flex; align-items: center; gap: 0.9rem; min-width: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }
  .day-name { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .day-when { text-align: right; }
  .day-time { font-weight: 600; font-variant-numeric: tabular-nums; }
  .day-et { color: var(--text-dim); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .day.on { border-color: rgba(197, 0, 0, 0.55); }
  .day.on .dot { background: var(--accent); }
  .day.live { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--panel); }
  .day.live .dot { box-shadow: 0 0 0 4px rgba(197, 0, 0, 0.3); animation: pulse 1.6s ease-in-out infinite; }
  .day.off .day-name, .day.off .day-time { color: var(--text-dim); font-weight: 500; }
  .badge { margin-left: 0.6rem; vertical-align: middle; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(197, 0, 0, 0); } }

  @media (max-width: 460px) {
    .day { padding: 0.85rem 1rem; }
    .day-main { gap: 0.7rem; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to schedule</a>

<div class="wrap wrap-narrow">
  <header class="topbar">
    <a class="brand" href="https://www.twitch.tv/coopgg_">
      <img src="assets/avatar.png" alt="">
      <span class="brand-name">Coop<b>GG</b></span>
    </a>
    <nav class="topnav" aria-label="Site">
      <a href="commands.html">Commands</a>
      <a href="schedule.html" aria-current="page">Schedule</a>
      <a href="links.html">Links</a>
    </nav>
  </header>

  <section class="hero">
    <p class="eyebrow">Stream schedule</p>
    <h1>When I'm live</h1>
    <p class="lede" id="lede">Monday, Tuesday and Wednesday, 9:00 PM to 1:00 AM Eastern.</p>
  </section>

  <main id="main">
    <div class="next" id="next">
      <div>
        <p class="next-label" id="next-label">Next stream</p>
        <p class="next-time" id="next-time">Calculating</p>
        <p class="next-count" id="next-count"></p>
      </div>
      <a class="btn" href="https://www.twitch.tv/coopgg_" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        Watch live
      </a>
    </div>

    <h2 class="week-title">This week</h2>
    <p class="tz-note">Times are shown in your time zone: <b id="tz-name">detecting</b></p>
    <ul class="week" id="week"></ul>
  </main>
</div>

<footer>
  <div class="wrap wrap-narrow">
    <span>&copy; 2026 CoopGG</span>
    <span>Built with <a href="https://coopgg.github.io/streamgpt-suite/index.html"><img src="assets/streamgpt-logo.png" alt="">StreamGPT Suite</a></span>
  </div>
</footer>

<script>
  // The whole schedule lives here. Change these three lines and the page, the countdown and the live badge all follow.
  var STREAM_DAYS = [1, 2, 3];     // 0 = Sunday ... 6 = Saturday, counted in Eastern time (the day a stream starts)
  var START_HOUR_ET = 21;          // 9 PM Eastern
  var STREAM_HOURS = 4;            // ends 1 AM Eastern the next morning
  var ET = 'America/New_York';
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  // Minutes that Eastern time is away from UTC at a given moment (-300 in winter, -240 in summer).
  function etOffsetMin(date) {
    var p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: ET, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric' })
      .formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
    var wallAsUtc = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute);
    return Math.round((wallAsUtc - Math.floor(date.getTime() / 60000) * 60000) / 60000);
  }

  // The Eastern calendar date for a moment, as a UTC-midnight Date so day arithmetic is safe.
  function etDate(date) {
    var p = {};
    new Intl.DateTimeFormat('en-US', { timeZone: ET, year: 'numeric', month: 'numeric', day: 'numeric' })
      .formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
    return new Date(Date.UTC(+p.year, +p.month - 1, +p.day));
  }

  // Every stream that starts from yesterday to a week from now, earliest first: { start, end }.
  function occurrences(now) {
    var base = etDate(now), list = [];
    for (var i = -1; i <= 8; i++) {
      var d = new Date(base.getTime() + i * 86400000);
      if (STREAM_DAYS.indexOf(d.getUTCDay()) === -1) continue;
      var noon = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12));
      var start = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), START_HOUR_ET) - etOffsetMin(noon) * 60000);
      list.push({ start: start, end: new Date(start.getTime() + STREAM_HOURS * 3600000), etDay: d.getUTCDay() });
    }
    return list;
  }

  // What the page needs to know at a given moment.
  function scheduleState(now) {
    var occ = occurrences(now);
    var current = occ.filter(function (o) { return o.start <= now && now < o.end; })[0] || null;
    var next = occ.filter(function (o) { return o.start > now; })[0] || null;
    // one row per stream day: the one happening now, or the next one coming up
    var rows = {};
    STREAM_DAYS.forEach(function (etDay) {
      var mine = occ.filter(function (o) { return o.etDay === etDay && o.end > now; })[0];
      if (mine) rows[mine.start.getDay()] = mine;      // keyed by the viewer's own weekday
    });
    return { live: current, next: next, rows: rows };
  }

  function timeText(date) { return date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function etText(date) { return date.toLocaleTimeString('en-US', { timeZone: ET, hour: 'numeric', minute: '2-digit' }); }
  function etAbbr(date) {
    var part = new Intl.DateTimeFormat('en-US', { timeZone: ET, timeZoneName: 'short' }).formatToParts(date).filter(function (x) { return x.type === 'timeZoneName'; })[0];
    return part ? part.value : 'ET';
  }
  function countdown(ms) {
    var mins = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60), m = mins % 60;
    if (d > 0) return 'in ' + d + 'd ' + h + 'h ' + m + 'm';
    if (h > 0) return 'in ' + h + 'h ' + m + 'm';
    return 'in ' + m + 'm';
  }
  function joinDays(names) { return names.length < 2 ? names.join('') : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1]; }

  function render() {
    var now = new Date(), st = scheduleState(now);
    var first = st.next || st.live;

    document.getElementById('tz-name').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g, ' ');
    var sample = first ? first.start : now;
    document.getElementById('lede').textContent = joinDays(STREAM_DAYS.map(function (d) { return DAYS[d]; })) + ', '
      + etText(sample) + ' to ' + etText(new Date(sample.getTime() + STREAM_HOURS * 3600000)) + ' ' + etAbbr(sample) + '.';

    var box = document.getElementById('next');
    box.classList.toggle('is-live', !!st.live);
    if (st.live) {
      document.getElementById('next-label').textContent = 'Live now';
      document.getElementById('next-time').textContent = 'Come hang out';
      document.getElementById('next-count').textContent = 'Started at ' + timeText(st.live.start);
    } else if (st.next) {
      document.getElementById('next-label').textContent = 'Next stream';
      document.getElementById('next-time').textContent = DAYS[st.next.start.getDay()] + ', '
        + st.next.start.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' at ' + timeText(st.next.start);
      document.getElementById('next-count').textContent = countdown(st.next.start - now);
    }

    var sameZone = etOffsetMin(now) === -now.getTimezoneOffset();   // viewers already on Eastern time don't need the second line
    var week = document.getElementById('week');
    week.innerHTML = '';
    DAYS.forEach(function (name, idx) {
      var occ = st.rows[idx], li = document.createElement('li');
      var isLive = !!(occ && st.live && occ.start.getTime() === st.live.start.getTime());
      li.className = 'day ' + (occ ? 'on' : 'off') + (isLive ? ' live' : '');
      var badge = isLive ? '<span class="tag tag-streamer badge">Live</span>' : '';
      var when = occ
        ? '<div class="day-time">' + timeText(occ.start) + ' to ' + timeText(occ.end) + '</div>'
          + (sameZone ? '' : '<div class="day-et">' + etText(occ.start) + ' to ' + etText(occ.end) + ' ' + etAbbr(occ.start) + '</div>')
        : '<div class="day-time">Off</div>';
      li.innerHTML = '<div class="day-main"><span class="dot" aria-hidden="true"></span><span class="day-name">' + name + badge + '</span></div>'
        + '<div class="day-when">' + when + '</div>';
      week.appendChild(li);
    });
  }

  render();
  setInterval(render, 60000);   // refresh every minute
</script>
</body>
</html>
